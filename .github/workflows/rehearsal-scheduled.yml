name: TBP-001 bounded scheduler rehearsal
on:
  schedule:
    - cron: '37 11 22 11 *'
permissions:
  contents: read
concurrency:
  group: tbp-001-bounded-scheduler-rehearsal
  cancel-in-progress: false
jobs:
  fixture:
    if: github.event_name == 'schedule' && github.repository == 'ProjectWhiteOak/tbp-001' && github.event.repository.visibility == 'public'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      FIXTURE_REVISION: 85b9abe8056c0a0429210a8b217866455d46bad0
    steps:
      - name: Validate provenance and rehearsal window
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = schedule
          test "$GITHUB_RUN_ATTEMPT" = 1
          now=$(date -u '+%s')
          earliest=$(date -u -d '2026-11-22 11:37:00' '+%s')
          latest=$(date -u -d '2026-11-22 12:07:00' '+%s')
          if (( now < earliest || now >= latest )); then
            echo 'Outside the one-time 2026 rehearsal window. No handshake executed.'
            exit 1
          fi
          printf 'event=%s workflow_sha=%s fixture_sha=%s actual_utc=%s\n' "$GITHUB_EVENT_NAME" "$GITHUB_SHA" "$FIXTURE_REVISION" "$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
      - name: Run the pinned fixture in a fresh hosted runner
        shell: bash
        run: |
          set -euo pipefail
          git init -q
          git fetch --quiet --depth=1 https://github.com/ProjectWhiteOak/tbp-001.git "$FIXTURE_REVISION"
          git checkout --quiet --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$FIXTURE_REVISION"
          python3 -m unittest discover -s tests -v
          mkdir artifacts
          python3 -m tbp.rehearsal run artifacts/scheduled
          python3 -m tbp.rehearsal verify artifacts/scheduled
          sha256sum artifacts/scheduled/manifest.json
          cat artifacts/scheduled/verification.json
