name: TBP-001 synthetic runner rehearsal
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/rehearsal.yml
      - 'tbp/**'
      - 'tests/**'
      - 'schemas/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tbp-001-synthetic-rehearsal
  cancel-in-progress: false
jobs:
  fixture:
    if: github.repository == 'ProjectWhiteOak/tbp-001' && github.event.repository.visibility == 'public'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out the exact triggering revision without credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          git init -q
          git fetch --quiet --depth=1 https://github.com/ProjectWhiteOak/tbp-001.git "$GITHUB_SHA"
          git checkout --quiet --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf 'repository=%s sha=%s event=%s attempt=%s\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_EVENT_NAME" "$GITHUB_RUN_ATTEMPT"
      - name: Verify synthetic handshake on fresh hosted runner
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          python3 --version
          python3 -m unittest discover -s tests -v
          mkdir artifacts
          python3 -m tbp.rehearsal run artifacts/hosted
          python3 -m tbp.rehearsal verify artifacts/hosted
          sha256sum artifacts/hosted/manifest.json
          cat artifacts/hosted/verification.json
